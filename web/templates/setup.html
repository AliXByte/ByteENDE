<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ByteENDE · First-time setup</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
{% from "_icons.html" import icon %}
<div class="bg-fx"><i></i><i></i><i></i></div>
<div class="auth-wrap"><div class="auth-card">
  <div class="brand">
    <div class="mark"><img src="{{ url_for('static', filename='logo.png') }}" alt="AliXByte logo"></div>
    <h1>ByteENDE</h1>
    <span>Welcome — let's create your owner account.<br>This is the only account; keep its credentials safe.</span>
  </div>
  <form method="post" id="setupForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field"><label>Username</label><input name="username" maxlength="24" minlength="3" required autofocus autocomplete="username"></div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input name="password" id="setupPassword" type="password" maxlength="64" minlength="8" required autocomplete="new-password">
        <button type="button" class="pw-toggle" data-for="setupPassword" title="Show password">{{ icon('eye') }}</button>
      </div>
      <div class="pw-meter" id="pwMeter"><span></span></div>
      <div class="help" id="pwMeterLabel">At least 8 characters.</div>
    </div>
    <div class="field">
      <label>Repeat password</label>
      <div class="pw-wrap">
        <input name="password2" id="setupPassword2" type="password" maxlength="64" minlength="8" required autocomplete="new-password">
        <button type="button" class="pw-toggle" data-for="setupPassword2" title="Show password">{{ icon('eye') }}</button>
      </div>
    </div>
    <div class="err">{{ error or '' }}</div>
    <button class="btn primary block" type="submit">Create account</button>
  </form>
</div></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
